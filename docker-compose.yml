services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phera
      POSTGRES_PASSWORD: phera
      POSTGRES_DB: phera
    ports:
      - "5433:5432"
    volumes:
      - phera_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318"

  phera:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://phera:phera@postgres:5432/phera
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENABLED: "1"
      PHERA_ROLE: all
    ports:
      - "8010:8010"
    depends_on:
      - postgres
      - redis
      - otel-collector
    command: ["phera", "all", "--host", "0.0.0.0", "--port", "8010"]

volumes:
  phera_pg:
